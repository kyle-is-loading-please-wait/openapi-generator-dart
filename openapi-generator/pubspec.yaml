name: openapi_generator
description: Generator for openapi client sdk inspired by the npm implementation of openapi-generator-cli.
version: 6.1.0
homepage: https://github.com/gibahjoe/openapi-generator-dart
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependency_overrides:
  dart_style: 3.1.2
  analyzer: ^8.1.1

dependencies:
  build: '>=2.0.0 <=4.0.0'
  source_gen: '>=3.0.0 <=5.0.0'
  path: '>=1.0.0 <=2.0.0'
  openapi_generator_annotations:
    git:
      ref: test
      url: https://github.com/kyle-is-loading-please-wait/openapi-generator-dart/
      path: openapi-generator-annotations
  analyzer: ^8.1.1
  openapi_generator_cli:
    git:
      ref: test
      url: https://github.com/kyle-is-loading-please-wait/openapi-generator-dart/
      path: openapi-generator-cli

  crypto: '>=3.0.6 <=4.0.0'
  meta: '>=1.15.0 <=2.0.0'
  yaml: ^3.1.3
  http: '>=0.13.1 <=2.0.0'
  logging: '>=1.0.0 <=2.0.0'

dev_dependencies:
  test: ^1.24.2
  mockito: ^5.4.4
  build_test: '>=3.3.0'
  source_gen_test: ^1.3.1
  test_process:
  pedantic:
  build_runner:
  coverage: ^1.6.3
