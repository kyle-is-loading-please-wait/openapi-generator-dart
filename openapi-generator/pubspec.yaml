name: openapi_generator
description: Generator for openapi client sdk inspired by the npm implementation of openapi-generator-cli.
version: 6.1.0
homepage: https://github.com/gibahjoe/openapi-generator-dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  build: '>=2.0.0 <=4.0.0'
  source_gen: '>=1.0.0 <=3.1.1'
  path: '>=1.0.0 <=2.0.0'
  openapi_generator_annotations:
    git:
      ref: test
      url: https://github.com/kyle-is-loading-please-wait/openapi-generator-dart/
      path: openapi-generator_annotations
  analyzer: '>=7.5.1 <8.0.0'
  openapi_generator_cli: ^6.1.0
  crypto: '>=3.0.6 <=4.0.0'
  meta: '>=1.15.0 <=2.0.0'
  yaml: ^3.1.2
  http: '>=0.13.1 <=2.0.0'
  logging: '>=1.0.0 <=2.0.0'

dev_dependencies:
  test: ^1.24.2
  mockito: ^5.4.4
  build_test: '>=1.2.0 <3.1.1'
  source_gen_test:
  test_process:
  pedantic:
  build_runner:
  coverage: ^1.6.3
